name: C++ CMake CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build-fedora:
    runs-on: ubuntu-latest
    container:
      image: fedora:44

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    # FIX: Updated to support Fedora's new dnf5 group syntax
    - name: Install Build Dependencies
      run: |
        dnf group install -y "Development Tools"
        dnf install -y cmake

    - name: Configure CMake
      run: cmake -B build -S .

    - name: Build Project
      run: cmake --build build