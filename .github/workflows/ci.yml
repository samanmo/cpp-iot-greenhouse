name: C++ CMake CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build-fedora:
    runs-on: ubuntu-latest
    container:
      image: fedora:44

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    # FIX: Uses the DNF5 group shorthand or explicitly targeted packages
    - name: Install Build Dependencies
      run: |
        dnf install -y @development-tools gcc-c++ make cmake
        
    - name: Configure CMake
      run: cmake -B build -S .

    - name: Build Project
      run: cmake --build build